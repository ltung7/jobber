<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .teal { fill: #006269; }
      .gold { fill: #D49A1C; }
      .logo-text {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>
  
  <!-- Square Background -->
  <rect width="200" height="200" fill="transparent" />

  <!-- Centered and Skewed Logo Group -->
  <g transform="translate(35, 10) skewX(-16)">
    <!-- 'E' -->
    <path class="teal" d="M 20 128 L 68 128 L 68 117 L 34 117 L 34 109 L 56 109 L 56 99 L 34 99 L 34 91 L 64 91 L 64 80 L 20 80 Z" />

    <!-- 'i' stem -->
    <polygon class="teal" points="76,128 90,128 90,92 76,82" />

    <!-- 'i' dot (Gold Parallelogram) -->
    <polygon class="gold" points="77,67 101,57 101,70 77,80" />

    <!-- 'SG' Text -->
    <text class="teal logo-text" x="97" y="129">SG</text>
  </g>
</svg>
